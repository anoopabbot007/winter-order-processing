spring:
  application:
    name: winter-order-processing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${DB_USERNAME:order_app}
    password: ${DB_PASSWORD:order_app_dev_only}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

orders:
  processing:
    cron: ${ORDER_PROCESSING_CRON:0 */5 * * * *}
    zone: ${ORDER_PROCESSING_ZONE:UTC}
    batch-size: ${ORDER_PROCESSING_BATCH_SIZE:100}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.orm.jpa: INFO
